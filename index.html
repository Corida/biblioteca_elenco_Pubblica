 const parole=norm($("q").value).split(/\s+/).filter(Boolean),g=$("g").value,e=$("e").value,d=$("d").checked;

  return s*a.r[i].localeCompare(b.r[i],"it",{numeric:true})||a.r[0].localeCompare(b.r[0]);
 });

 const tb=$("tb");tb.textContent="";

  const r=x.r,tr=document.createElement("tr");
  cella(tr,"p",r[0],"Prot.");cella(tr,"t",r[1]);cella(tr,"",r[2],"Genere");cella(tr,"",r[3],"Autore");
